<!DOCTYPE html>
<html lang="PT-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Sonho</title>
    <style>
        body {
            background-color: #202427;
            color: #b8b6b5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #CadastroForm {
            background-color: #2c3136;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #3d444b;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #CadastroForm h1 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 1.8em;
            text-align: center;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .campo-grupo label {
            font-size: 0.95em;
            font-weight: bold;
            color: #ffffff;
        }

        #CadastroForm input[type="text"] {
            background-color: #202427;
            border: 1px solid #4f575f;
            border-radius: 6px;
            padding: 10px;
            color: #ffffff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
        }

        #CadastroForm input[type="text"]:focus {
            border-color: #ffcc00;
        }

        .checkbox-grupo {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }

        .checkbox-linha {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
            color: #ffffff;
        }

        .opcoes-visita {
            display: flex;
            gap: 20px;
            margin-top: 4px;
        }

        #CadastroForm button[type="submit"] {
            background-color: #ffcc00;
            color: #202427;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        #CadastroForm button[type="submit"]:hover {
            transform: translateY(-2px);
            background-color: #e6b800;
        }

        #CadastroForm button[type="submit"]:active {
            transform: scale(0.98);
        }
        a{
            text-decoration: none;
            text-align: center;
            background-color: #ffcc00;
            color: #202427;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        a:hover{
            transform: translateY(-2px);
            background-color: #e6b800;
        }
    </style>
</head>

<body>
    <form id="CadastroForm">
        <h1>Lista de Viagem</h1>
        <label>Estado: <input type="text" name="estado" required></label>
        <label>País: <input type="text" name="pais" required></label>
        <label>Visitado: <input type="checkbox" name="Sim" id="opcaoS">Sim<input type="checkbox" name="Nao"
                id="opcaoN">Não</label>
        <label>Internacional: <input type="checkbox" name="internacional" id="opcaoI"></label>
        <button type="submit">Enviar</button>
        <a href="Lista_Do_Sonho.html">Ir para lista</a>
    </form>
    <script>
        const form = document.querySelector("#CadastroForm");
        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const estado = {
                estado: form.estado.value,
                pais: form.pais.value,
                Sim: form.Sim.checked,
                Nao: form.Nao.checked,
                internacional: form.internacional.checked
            };

            let lista = JSON.parse(localStorage.getItem("estado")) || [];

            lista.push(estado);

            localStorage.setItem("estado", JSON.stringify(lista));

            window.location.href = "Lista_Do_Sonho.html";

        })

    </script>
</body>

</html>
